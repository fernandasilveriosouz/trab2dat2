<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <span class="logo">Ever After High</span>
        <nav class="menu">
            <a href="index.html" class="ativo">
                Início
            </a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section class="conteudo">
            <h1>Contato!</h1>
            <p>Se tiver dúvidas, entre em contato!</p>
            <p class="coracao" aria-label="coração">♥</p>

            <form class="form" action="#">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="name" placeholder="Seu nome">
                </div>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="@email.com">
                </div>
                <div class="campo">
                    <label for="msg">Mensagem</label>
                    <textarea name="msg" id="msg" rows="4" placeholder="Escreva sua msg"></textarea>
                    </textarea>
                </div>
                <button type="submit" class="botao">
                    Enviar
                </button>
            </form>
        </section>
    </main>
    
    <footer class="rodape">
        <p>Feito por Fernanda 2DAT2 - Projeto Frontend</p>
    </footer>
</body>
</html>
